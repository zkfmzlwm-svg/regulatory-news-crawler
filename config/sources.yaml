# 의약품 규제 뉴스 수집 대상 사이트 설정
#
# type: rss  -> RSS/Atom 피드 URL (feedparser 사용)
# type: html -> RSS가 없는 사이트를 위한 목록 페이지 스크래핑 (CSS 선택자 필요)
# tag:  -> 요약 결과 제목에 붙는 "[태그]" 표기 (예: [FDA]). 생략하면 name 앞부분으로 자동 지정
#
# 사이트를 추가하려면 `python main.py add-source` 명령을 쓰거나
# 이 파일에 직접 항목을 추가하면 됩니다.
# 각 소스는 name(고유)으로 구분됩니다. enabled: false 로 임시 비활성화 가능.

sources:
  # ---------------- 주요 해외 규제기관 (기본 제공) ----------------
  - name: "FDA - Press Announcements"
    type: rss
    url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
    region: "US"
    tag: "FDA"
    enabled: true

  - name: "FDA - What's New (Drugs)"
    type: rss
    url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/drugs/rss.xml"
    region: "US"
    tag: "FDA"
    enabled: true

  - name: "EMA - News"
    type: rss
    url: "https://www.ema.europa.eu/en/news.xml"
    region: "EU"
    tag: "EMA"
    enabled: true

  - name: "MHRA (UK) - News & Communications"
    type: rss
    url: "https://www.gov.uk/government/organisations/medicines-and-healthcare-products-regulatory-agency.atom"
    region: "UK"
    tag: "MHRA"
    enabled: true

  - name: "Health Canada - Recalls & Safety Alerts"
    type: rss
    url: "https://recalls-rappels.canada.ca/en/feed"
    region: "CA"
    tag: "Health Canada"
    enabled: true

  - name: "TGA (Australia) - News"
    type: rss
    url: "https://www.tga.gov.au/rss.xml"
    region: "AU"
    tag: "TGA"
    enabled: true

  - name: "WHO - News"
    type: rss
    url: "https://www.who.int/rss-feeds/news-english.xml"
    region: "Global"
    tag: "WHO"
    enabled: true

  - name: "RAPS Regulatory Focus"
    type: rss
    url: "https://www.raps.org/rss/news"
    region: "Global"
    tag: "RAPS"
    enabled: true

  - name: "Endpoints News - Regulatory"
    type: rss
    url: "https://endpts.com/category/regulatory/feed/"
    region: "Global"
    tag: "Endpoints"
    enabled: true

  - name: "FiercePharma"
    type: rss
    url: "https://www.fiercepharma.com/rss/xml"
    region: "Global"
    tag: "FiercePharma"
    enabled: true

  # ---------------- 사용자 지정 사이트 ----------------
  - name: "GMP Compliance - Latest GMP News"
    type: html
    url: "https://www.gmp-compliance.org/gmp-news/latest-gmp-news"
    region: "EU"
    tag: "GMP-Compliance"
    enabled: true
    # 주의: 이 사이트는 구조를 직접 확인하지 못해 일반적인 뉴스 목록 구조로 추정해 등록했습니다.
    # item/title 선택자로 못 찾으면 주소에 "/gmp-news/" 가 들어간 긴 제목 링크들을 기사로 수집합니다.
    # 그래도 0건이면 페이지의 기사 목록 부분 HTML(브라우저 F12 > Elements)을 보내주시면 고쳐드립니다.
    selectors:
      item: "article"
      title: "h2 a, h3 a"
      link: "h2 a, h3 a"
      date: "time"
      link_pattern: "/gmp-news/"

  # ---------------- 사이트 추가 예시 (참고용) ----------------
  # - name: "My Custom Source"
  #   type: html
  #   url: "https://example.com/regulatory-news"
  #   region: "Custom"
  #   tag: "MySite"
  #   enabled: true
  #   selectors:
  #     item: "div.news-list li"      # 각 기사 블록
  #     title: "a.title"              # 블록 내 제목 요소
  #     link: "a.title"               # 블록 내 링크 요소 (href 사용)
  #     date: "span.date"             # 블록 내 날짜 요소 (선택)
  #     summary: "p.excerpt"          # 블록 내 요약 요소 (선택)
  #     link_pattern: "/news/"        # 위 선택자로 못 찾을 때, 주소에 이 문자열이 든 긴 제목 링크를 기사로 수집 (선택)
