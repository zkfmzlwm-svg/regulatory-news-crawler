# 의약품 규제 뉴스 수집 대상 사이트 설정
#
# type: rss  -> RSS/Atom 피드 URL (feedparser 사용)
# type: html -> RSS가 없는 사이트를 위한 목록 페이지 스크래핑 (CSS 선택자 필요)
# type: json -> 뉴스 목록을 JSON 으로 주는 API (fields 로 항목 경로 지정, 예: WHO)
# tag:  -> 요약 결과 제목에 붙는 "[태그]" 표기 (예: [FDA]). 생략하면 name 앞부분으로 자동 지정
# exclude_link_pattern: -> 기사 주소에 이 문자열(또는 목록 중 하나)이 들어가면 수집 제외 (예: "/sponsored/")
# pages / page_start: -> url 에 {page} 를 넣으면 목록을 여러 쪽 넘겨가며 수집 (수집 기간보다 오래된 기사가 나오면 멈춤)
#                        pages = 최대 쪽수, page_start = 첫 쪽 번호(기본 1, 0부터 세는 사이트는 0)
# first_page_url: -> 첫 쪽만 주소 규칙이 다른 경우의 첫 쪽 주소 (예: news.html, news_2.html, news_3.html ...)
# title_prefix: -> 수집한 제목 앞에 붙일 글자 (예: "Volume I 2026" -> "NMPA Newsletter - Volume I 2026")
# selectors.date_attr: -> html 타입에서 날짜를 글자 대신 date 요소의 속성 값에서 읽음 (예: img 의 src 주소에 든 날짜)
#
# 사이트를 추가하려면 `python main.py add-source` 명령을 쓰거나
# 이 파일에 직접 항목을 추가하면 됩니다.
# 각 소스는 name(고유)으로 구분됩니다. enabled: false 로 임시 비활성화 가능.

sources:
  # ---------------- 주요 해외 규제기관 (기본 제공) ----------------
  - name: "FDA - Press Announcements"
    type: rss
    url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"
    region: "US"
    tag: "FDA"
    enabled: true

  - name: "FDA - What's New (Drugs)"
    type: rss
    url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/drugs/rss.xml"
    region: "US"
    tag: "FDA"
    enabled: true

  - name: "EMA - News"
    type: rss
    url: "https://www.ema.europa.eu/en/news.xml"
    region: "EU"
    tag: "EMA"
    enabled: true

  # 기관 Atom 피드는 최근 20건(약 1주)만 줘서, 같은 내용을 100건까지 주는 GOV.UK 검색 API 를 사용
  - name: "MHRA (UK) - News & Communications"
    type: json
    url: "https://www.gov.uk/api/search.json?filter_organisations=medicines-and-healthcare-products-regulatory-agency&order=-public_timestamp&count=100&fields=title,link,public_timestamp,description"
    link_prefix: "https://www.gov.uk"
    region: "UK"
    tag: "MHRA"
    enabled: true
    exclude_link_pattern: "/government/collections/"   # 문서 묶음(목차) 페이지 제외
    fields:
      items: "results"
      title: "title"
      link: "link"
      date: "public_timestamp"
      summary: "description"

  # RSS 피드(feed/health-products-alerts-recalls)는 최근 3건 정도만 주고 의약품 리콜이 빠져 있어,
  # 사이트 검색의 '건강 제품(Health products)' 목록을 쪽을 넘겨가며 수집 (한 쪽 15건, 0쪽부터 시작)
  - name: "Health Canada - Recalls & Safety Alerts"
    type: html
    url: "https://recalls-rappels.canada.ca/en/search/site?f%5B0%5D=cat%3A180&page=%2C0%2C{page}"
    pages: 6
    page_start: 0
    region: "CA"
    tag: "Health Canada"
    enabled: true
    selectors:
      item: "div.search-result"
      title: "a[href*='/alert-recall/']"
      link: "a[href*='/alert-recall/']"
      date: ".ar-type"                 # "Health product recall | 2026-10-06"

  - name: "TGA (Australia) - News"
    type: rss
    url: "https://www.tga.gov.au/feeds/article/news.xml"
    region: "AU"
    tag: "TGA"
    enabled: true

  - name: "TGA (Australia) - Safety Alerts"
    type: rss
    url: "https://www.tga.gov.au/feeds/alert/safety-alerts.xml"
    region: "AU"
    tag: "TGA"
    enabled: true

  # WHO 공식 RSS(news-english.xml)는 2026년 2월 이후 갱신이 멈춰, 홈페이지가 쓰는 뉴스 API 를 사용
  - name: "WHO - News"
    type: json
    url: "https://www.who.int/api/news/newsitems?sf_culture=en&$orderby=PublicationDateAndTime%20desc&$top=60&$select=Title,ItemDefaultUrl,PublicationDateAndTime"
    link_prefix: "https://www.who.int/news/item"
    region: "Global"
    tag: "WHO"
    enabled: true
    fields:
      items: "value"
      title: "Title"
      link: "ItemDefaultUrl"
      date: "PublicationDateAndTime"

  # RAPS 는 사이트 개편 후 RSS 가 없어져 Regulatory Focus 목록 페이지에서 직접 수집한다
  - name: "RAPS Regulatory Focus"
    type: html
    url: "https://www.raps.org/news-insights/regulatory-focus.html?sortBy=recent"
    region: "Global"
    tag: "RAPS"
    enabled: true
    selectors:
      item: "article.article-list-item:has(.mod-published-date)"   # 날짜 없는 블록은 스폰서(광고) 기사
      title: "h4.article-title a"
      link: "h4.article-title a"
      date: ".mod-published-date"
      summary: ".article-teaser"
      link_pattern: "/resource/"

  # endpts.com -> endpoints.news 로 도메인 이전 (regulatory 카테고리 피드는 없어져 전체 피드 사용)
  - name: "Endpoints News"
    type: rss
    url: "https://endpoints.news/feed/"
    region: "Global"
    tag: "Endpoints"
    enabled: true

  # 전체 피드(/rss/xml)는 Cloudflare 챌린지로 막혀 있어 Pharma 섹션 피드를 사용
  # 기사 본문 페이지도 Cloudflare 로 막혀 요약은 RSS 의 제목 + 소개글로 만들어진다
  - name: "FiercePharma"
    type: rss
    url: "https://www.fiercepharma.com/rss/pharma/xml"
    region: "Global"
    tag: "FiercePharma"
    enabled: true
    exclude_link_pattern: "/sponsored/"   # 광고 기사 제외

  # ---------------- 사용자 지정 사이트 ----------------
  # 뉴스 목록 페이지는 자바스크립트로 그려져 HTML 에 기사가 없으므로(메뉴 링크만 잡힘),
  # 그 페이지에 걸려 있는 ECA 공식 뉴스 피드를 사용
  - name: "GMP Compliance - Latest GMP News"
    type: rss
    url: "https://app.gxp-services.net/eca_newsfeed.xml"
    region: "EU"
    tag: "GMP-Compliance"
    enabled: true

  # blogs.html 은 WordPress 페이지라 Blog 카테고리 전용 RSS 피드를 사용
  - name: "FDA Map - Blogs"
    type: rss
    url: "https://www.fdamap.com/category/blog/feed/"
    region: "US"
    tag: "FDAMap"
    enabled: true

  # NMPA 영문 사이트: 한 쪽에 6건뿐이라 쪽을 넘겨가며 수집 (첫 쪽은 news.html, 다음 쪽부터 news_2.html ...)
  # 기사 본문은 일반 웹페이지라 요약 가능
  - name: "NMPA (China) - News"
    type: html
    url: "https://english.nmpa.gov.cn/news_{page}.html"
    first_page_url: "https://english.nmpa.gov.cn/news.html"
    pages: 5
    region: "CN"
    tag: "NMPA"
    enabled: true
    selectors:
      item: "div.left div.list li"
      title: "h3.list-tit a"
      link: "h3.list-tit a"
      date: "p.list-date"
      summary: "p.list-desc"

  # 의약품 공고(Announcement)·정책 해설. 몇 달에 한 번 올라오므로 '기간 내 기사 없음'(△) 이 자주 나오는 게 정상
  - name: "NMPA (China) - Drugs"
    type: html
    url: "https://english.nmpa.gov.cn/drugs_{page}.html"
    first_page_url: "https://english.nmpa.gov.cn/drugs.html"
    pages: 3
    region: "CN"
    tag: "NMPA"
    enabled: true
    selectors:
      item: "div.left div.list li"
      title: "h3.list-tit a"
      link: "h3.list-tit a"
      date: "p.list-date"
      summary: "p.list-desc"

  # 뉴스레터 목록은 PDF 링크 + 썸네일뿐이고 발행일 표기가 없어, 썸네일 주소의 업로드일(.../site48/20260820/...)을
  # 발행일로 쓴다 (PDF 파일 수정일과 일치 확인). 1~2달에 한 번 나오므로 대부분의 수집에서는 '기간 내 기사 없음' 이 정상.
  # PDF 는 글자가 그림(외곽선)으로 들어 있어 본문 요약은 안 되고, 요약 시 링크 확인 안내만 나온다.
  - name: "NMPA (China) - Newsletter"
    type: html
    url: "https://english.nmpa.gov.cn/newsletter.html"
    region: "CN"
    tag: "NMPA"
    enabled: true
    title_prefix: "NMPA Newsletter - "
    selectors:
      item: "div.news-list li"
      title: "em"
      link: "a[href]"
      date: "img"
      date_attr: "src"

  # ---------------- 사이트 추가 예시 (참고용) ----------------
  # - name: "My Custom Source"
  #   type: html
  #   url: "https://example.com/regulatory-news"
  #   region: "Custom"
  #   tag: "MySite"
  #   enabled: true
  #   selectors:
  #     item: "div.news-list li"      # 각 기사 블록
  #     title: "a.title"              # 블록 내 제목 요소
  #     link: "a.title"               # 블록 내 링크 요소 (href 사용)
  #     date: "span.date"             # 블록 내 날짜 요소 (선택)
  #     summary: "p.excerpt"          # 블록 내 요약 요소 (선택)
  #     link_pattern: "/news/"        # 위 선택자로 못 찾을 때, 주소에 이 문자열이 든 긴 제목 링크를 기사로 수집 (선택)
